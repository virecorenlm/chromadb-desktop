name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install system dependencies (libmagic)
      run: sudo apt-get update && sudo apt-get install -y libmagic1
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache Hugging Face transformers cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/huggingface
          ~/.cache/torch
        key: ${{ runner.os }}-hf-models-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-hf-models-

    - name: Create venv and install requirements (editable)
      run: |
        python -m venv venv
        . venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt
        # Install the package in editable mode so tests can import `backend` cleanly
        pip install -e .

    - name: Run backend smoke test
      run: |
        . venv/bin/activate
        python tests/test_backend.py
